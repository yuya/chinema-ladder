<style>
:root{
  --bg:#F4F4F7;--surface:#FFFFFF;--fg:#17171C;--muted:#5E5E6B;--line:#E1E1E8;
  --brand:#E8607A;   /* ロゴとアイコンのピンク。ライト・ダーク共通 */
  --accent:#B4233C;--accent-soft:#F8E4E8;--ad:#EEF0F5;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111115;--surface:#1A1A20;--fg:#ECECF1;--muted:#A0A0AC;--line:#2C2C35;--accent:#E8607A;--accent-soft:#3A1D25;--ad:#202029;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
p,figure,ul,ol,hgroup{margin:0}
ul,ol{padding:0;list-style:none}
search{display:block}
/* 画面には出さず、読み上げ・検索エンジン向けにだけ残す */
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body > header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.hd{max-width:720px;margin:0 auto;display:flex;flex-direction:column}
/* ヘッダーは画面上部に固定。本文はヘッダーの（広げた状態の）高さ分だけ下げて始める */
body{padding-top:var(--hh,148px)}
/* スクロールしたら、サイト名・キャッチコピー・履歴を隠し、アイコンと検索欄を1行にする。
   動きはすべて transform・opacity・背景の高さだけで作り、要素の位置を組み替えない
   （位置が変わるとブラウザが「レイアウトのずれ」として数え、表示品質の評価が下がるため） */
body > header::before{content:"";position:absolute;inset:0 0 auto;height:100%;background:var(--surface);border-bottom:1px solid var(--line);transition:height .25s ease;z-index:-1}
.hd{transition:transform .25s ease}
.fold{transition:opacity .2s ease,visibility 0s}
.fold .brand{padding-bottom:8px}
.fold .hist{padding-top:8px}
.srow{position:relative}
.mini{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .25s}
.mini .mark{width:28px;height:28px;border-radius:7px;box-shadow:0 0 0 1px var(--line);flex:none}
.srow .sbox{width:100%;transition:transform .25s ease,width .25s ease}
.compact body > header{pointer-events:none}
.compact body > header .srow{pointer-events:auto}
.compact body > header::before{height:var(--hc,72px)}
.compact .hd{transform:translateY(calc(var(--brandh,40px) * -1))}
.compact .fold{opacity:0;visibility:hidden;transition:opacity .15s ease,visibility 0s .2s}
.compact .mini{opacity:1;visibility:visible;transition:opacity .2s ease .05s,visibility 0s}
.compact .srow .sbox{transform:translateX(38px);width:calc(100% - 38px)}
@media (prefers-reduced-motion:reduce){body > header::before,.hd,.fold,.mini,.srow .sbox{transition:none!important}}
.brand{flex-wrap:wrap;display:flex;align-items:baseline;gap:8px}
.logo{font-weight:800;font-size:19px;letter-spacing:.01em;color:inherit;text-decoration:none}
.logo .lad{color:var(--brand)}
.logo .name{white-space:nowrap}
.logo .mark{width:24px;height:24px;vertical-align:-5px;margin-right:7px;border-radius:6px;box-shadow:0 0 0 1px var(--line)}   /* brand/icon.svg と同じ絵（通信を増やさないよう直接埋め込み） */
.tagline{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;font-feature-settings:"palt" 1}   /* palt で「、」の後ろの空きを詰める */
.sbox{position:relative}
.search form{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px}
.search form:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;outline:none;font-size:16px}
.search svg{flex:none;width:17px;height:17px;stroke:var(--muted)}
.clear{border:0;background:transparent;color:var(--muted);padding:6px 8px;font-size:13px}

/* サジェスト */
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;max-height:60vh;overflow-y:auto;z-index:6;margin:0;padding:4px;list-style:none}
.sug li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.sug li[aria-selected="true"],.sug li:hover{background:var(--accent-soft)}
.sug img,.sug .noimg{width:36px;height:54px;border-radius:4px;object-fit:cover;background:var(--bg)}
.sug .t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .o{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .msg{display:block;padding:10px;color:var(--muted);font-size:13px;cursor:default}
.sug .msg:hover{background:none}

/* 履歴：チップの列だけ横スクロールし、全削除ボタンは右端に固定して見切れないようにする */
.hist{display:flex;gap:6px;align-items:center}
.hist .hl{flex:1;min-width:0;display:flex;margin:0;gap:6px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);padding-right:20px}
.hist .hl::-webkit-scrollbar{display:none}
.hist .lbl{font-size:12px;font-weight:400;margin:0;color:var(--muted);flex:none;align-self:center}
.hist .hc{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px}
.hist .hc button{border:0;background:transparent;border-radius:999px}
.hist .hc [data-q]{padding:3px 2px 3px 11px}
.hist .x{padding:3px 10px 3px 6px;color:var(--muted);line-height:1}
.hist .x:hover{color:var(--accent)}
.hist .delall{flex:none;display:flex;align-items:center;gap:4px;height:30px;min-width:30px;justify-content:center;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:0 6px;font-size:12px;font-weight:700;white-space:nowrap}
.hist .delall svg{width:16px;height:16px}
.hist .delall:hover{color:var(--accent)}
.hist .delall.warn{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);padding:0 10px 0 8px}

main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;
  display:flex;flex-direction:column;gap:18px}
.movie{display:flex;flex-direction:column;gap:18px}
.now{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
/* 共有は控えめに：枠なし・アイコンだけ・作品欄の右下（押せる範囲は 32px 確保） */
.share{align-self:end;display:grid;place-items:center;width:32px;height:32px;margin:0 -6px -4px 0;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:0}
.share:hover{color:var(--accent);background:var(--accent-soft)}
.share svg{width:17px;height:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ポスター枠は画像の有無にかかわらず常に 64×96 を確保し、読み込み後にずれないようにする */
.now .ph{position:relative;width:64px;height:96px;flex:none;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--line)}
.now .ph svg{width:24px;height:24px}
.now .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.now .ph img.ok{opacity:1}
.now .k{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.now h1{margin:0;font-size:clamp(20px,5.6vw,24px);line-height:1.3;text-wrap:balance;word-break:auto-phrase;overflow-wrap:anywhere}
/* 作品名は語のまとまりごとに改行する（「ディスクロー／ジャー」のように語の途中で切れないように）。
   入りきらない長い語だけは途中で折り返す */
.now h1 .w{display:inline-block;max-width:100%}
/* 作品情報（あらすじなど）。最初はたたんでおき、ネタバレを避けたい人は開かなくて済むようにする */
/* 作品情報：枠を付けず、本文に直接のせる（TOP10 の箱と見分けがつくように）
   公開日・上映時間・ジャンルは見出しの中に常に1行で出し、あらすじとキャストは文字のリンクで開く */
.now .meta{display:block;min-height:1.6em}   /* 情報が届く前から1行分の高さを確保し、ずれを防ぐ */
details.info{background:none;border:0;border-radius:0;padding:0;font-size:14px;margin-top:-6px}
.info summary{list-style:none;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:700;padding:4px 0}
.info summary::-webkit-details-marker{display:none}
.info summary::after{content:"▾";font-size:11px}
.info[open] summary::after{content:"▴"}
.info .cl,.info[open] .op{display:none}
.info[open] .cl{display:inline}
.info .body{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-width:65ch}
.info .tag{font-weight:700;margin:0}
.info .ov{margin:0;line-height:1.8}
.info .lang,.info .cr,.info .src{margin:0;font-size:13px;color:var(--muted)}
.info .ld{min-height:120px}   /* 開いた状態で読み込み中のときも高さを確保し、届いたときに下がずれにくくする */
.info .cr + .cr{margin-top:-6px}   /* 監督・出演・製作国はひとまとまりに詰める */
.info .src{font-size:12px}
.info .src a{color:inherit}
.now .ex{font-size:12px;color:var(--muted)}

.grp{display:flex;flex-direction:column;gap:8px}
.grp hgroup{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp h2{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.grp hgroup p{font-size:12px;color:var(--muted)}
.grid li{display:flex;min-width:0}
.grid li > a{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
a.go{display:flex;flex-direction:column;gap:1px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px;min-height:64px;justify-content:center;transition:border-color .12s,transform .12s}
a.go:hover{border-color:var(--accent)}
a.go:active{transform:scale(.98)}
/* 1行に収める工夫：
   - palt で和文の字間を詰める（フォントの機能を使うだけなので負荷はほぼ無い）
   - ↗ は右上の隅に置き、名前の行の幅を空ける
   - それでも入らない狭い画面では、改行せず末尾を「…」にする */
a.go{position:relative;font-feature-settings:"palt" 1}
a.go .n{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;padding-right:10px}
a.go .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
a.go .d .pr{margin-right:5px;vertical-align:1px}
a.go .fav{width:16px;height:16px;border-radius:3px;flex:none;background-position:center;background-size:16px 16px;background-repeat:no-repeat}

/* ===== TMDB サジェスト ===== */
const cache=new Map();
let ctrl=null,timer=null,items=[],active=-1;

/* 作品名一覧（data/titles.json）から候補を出す。トークン不要で誰でも使える。
   GitHub Actions が毎日、人気作・評価の多い作品・上映中・公開予定の数千本を書き出している。 */
let titles=null,titlesLoading=null;
// 表記ゆれ対策：全角半角・カタカナひらがな・記号や空白の違いを無視して比べる
const norm=s=>(s||"").normalize("NFKC").toLowerCase()
  .replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
  .replace(/[\s・･:：\-‐－ー〜~!！?？、。,.「」『』（）()\/／&＆'"]/g,"");
function loadTitles(){
  if(titles)return Promise.resolve(titles);
  return titlesLoading??=fetch("data/titles.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
    titles=j.items.map(([id,title,year,poster,original])=>({id,title,date:year,poster,original:original||title,k:norm(title),ko:original?norm(original):""}));
    return titles;
  }).catch(e=>{titlesLoading=null;throw e});
}
async function searchLocal(q){
  const list=await loadTitles(),k=norm(q);
  if(!k)return [];
  const head=[],mid=[];   // 前方一致を先に、部分一致を後に（どちらも人気順）
  for(const m of list){
    if(m.k.startsWith(k)||m.ko.startsWith(k))head.push(m);
    else if(m.k.includes(k)||m.ko.includes(k))mid.push(m);
    if(head.length>=8)break;
  }
  return head.concat(mid).slice(0,8);
}

async function searchTMDB(q){
  if(cache.has(q))return cache.get(q);
  ctrl?.abort();ctrl=new AbortController();
  let res;
  try{
    const r=await fetch(TMDB_PROXY+"?q="+E(q),{signal:ctrl.signal});
    if(!r.ok)throw new Error(r.status);
    res=await r.json();
    if(!Array.isArray(res))throw new Error("bad");
  }catch(e){
    if(e.name==="AbortError")throw e;
    res=await searchLocal(q);   // 中継が使えないときは作品一覧から候補を出す
  }
  cache.set(q,res);return res;
}
/* ===== 話題作TOP10（日本で上映中＋公開予定を人気順に） ===== */
let trendList=null;
async function getTrending(){
  if(trendList)return trendList;
  // 1. GitHub Actions が毎日作る data/trending.json（トークン不要・誰でも見られる）
  try{
    const r=await fetch("data/trending.json",{cache:"no-cache"});
    if(r.ok){const j=await r.json();if(j.items?.length){trendList=j.items;return trendList}}
  }catch(e){}
  // 2. ファイルが読めないときは中継サーバーから
  const r=await fetch(TMDB_PROXY.replace(/search$/,"trending"));
  if(!r.ok)throw new Error(r.status);
  trendList=await r.json();
  return trendList;
}
let lastPick=null;
async function showTrending(){
  const before=$("#q").value;
  try{
    const list=await getTrending();
    if($("#q").value!==before)return;   // 読み込み中に入力されたら上書きしない
    if(list.length){
      const pool=list.length>1?list.filter(m=>m.id!==lastPick):list;   // 同じ作品が連続しないように
      const m=pool[Math.floor(Math.random()*pool.length)];lastPick=m.id;
      $("#q").value=m.title;   // 検索ボックスにも同じ作品名を入れる
      render(m.title,"trend",m);return;
    }
  }catch(e){}
  if($("#q").value===before){$("#q").value="";renderEmpty()}
}

/* TOP10を閉じるアニメーション：高さを0に縮めながら薄くし、終わったら details を閉じる */
function collapseTop(){
  const d=$("#top"),ol=d?.querySelector("ol");
  if(!d||!d.open)return;
  if(!ol||!ol.animate||matchMedia("(prefers-reduced-motion: reduce)").matches){d.open=false;return}
  ol.style.overflow="hidden";
  const a=ol.animate([{height:ol.offsetHeight+"px",opacity:1,marginTop:"8px"},{height:"0px",opacity:0,marginTop:"0px"}],
    {duration:320,delay:120,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});   // 選んだ行の色が一瞬見えてから閉じる
  a.onfinish=()=>{d.open=false;a.cancel();ol.style.overflow=""};
}

function onType(){
  const q=clean($("#q").value);
  clearTimeout(timer);
  if(q.length<1){hideSug();return}
  timer=setTimeout(async()=>{
    try{
      const r=await searchTMDB(q);
      if(clean($("#q").value)!==q)return;
      items=r;active=-1;
      r.length?drawSug():showSug('<li class="msg">候補にありません。Enter でそのまま検索できます。</li>');
    }catch(e){
      if(e.name==="AbortError")return;
      items=[];
      showSug('<li class="msg">候補を取得できませんでした。そのまま検索はできます。</li>');
    }
  },250);
}

/* 作品名から TMDB の情報を、手元にない場合に取りに行く。
   1. 作品一覧（data/titles.json） 2. 中継サーバーで検索し、タイトルが完全に一致したもの */
async function lookupMovie(q){
  try{await loadTitles();const m=findMovie(q);if(m)return m}catch(e){}
  try{
    const r=await fetch(TMDB_PROXY+"?q="+E(q));
    if(r.ok){const list=await r.json();if(Array.isArray(list)){cache.set(q,list);return list.find(m=>m.title===q)||null}}
  }catch(e){}
  return null;
}
/* 作品名を、区切りの記号（・／ 空白 ： 〜 など）の後ろでだけ改行できるまとまりに分けて <span class="w"> で包む。
   「ディスクロージャー・デイ」が「ディスクロー／ジャー・デイ」のように語の途中で切れるのを防ぐ。
   まとまり自体が1行に入らないときは中で折り返す（Chrome は word-break:auto-phrase で文節ごとに折り返す） */
function wrapWords(t){
  const parts=t.split(/(?<=[・･／/\s：:〜~！!？?、。）)」』】])|(?=[（(「『【])/).filter(Boolean);   // ハイフンは「ゴジラ-0.0」のように名前の一部なので区切らない
  return parts.map(w=>`<span class="w">${esc(w)}</span>`).join("");
}
/* ===== 作品情報（あらすじ・公開日・上映時間・ジャンル・監督・出演・製作国） ===== */
const infoCache=new Map();

function loadInfo(id){
  if(!id)return Promise.resolve(null);
  if(!infoCache.has(id))infoCache.set(id,fetch(TMDB_PROXY.replace(/search$/,"movie")+"?id="+E(id))
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(e=>{infoCache.delete(id);throw e}));
  return infoCache.get(id);
}
const regionJa=typeof Intl!=="undefined"&&Intl.DisplayNames?new Intl.DisplayNames(["ja"],{type:"region"}):null;
const ymd=d=>d?`${+d.slice(0,4)}年${+d.slice(5,7)}月${+d.slice(8,10)}日`:"";
// 見出しの中に出す1行：公開日・上映時間・ジャンル（ネタバレにならないので常に表示）

  const date=d.jpDate||d.date;
  return [date?ymd(date)+"公開":"",d.runtime?`${d.runtime}分`:"",d.genres.slice(0,3).join("／")].filter(Boolean).join("・");
}
function infoHTML(st,d){

  }else body=`<p class="lang${st==="loading"?" ld":""}">${st==="none"?"この作品の情報は見つかりませんでした。":st==="err"?"作品情報を読み込めませんでした。時間をおいて開き直してください。":"読み込み中…"}</p>`;
  return `<details class="info" id="info"${infoOpen?" open":""}><summary><span class="op">あらすじ・キャストを見る</span><span class="cl">あらすじ・キャストを閉じる</span></summary><div class="body">${body}</div></details>`;

  const m=$("#imeta");if(m&&st==="ok")m.textContent=metaText(d);

/* 検索エンジン向けの作品データ（schema.org の Movie） */
function setLD(d){
  let el=document.getElementById("ld");
  if(!d){el?.remove();return}
  if(!el){el=document.createElement("script");el.type="application/ld+json";el.id="ld";document.head.append(el)}
  const o={"@context":"https://schema.org","@type":"Movie",name:d.title,url:new URL("?q="+E(d.title),SITE).href};
  if(d.original&&d.original!==d.title)o.alternateName=d.original;
  if(d.jpDate||d.date)o.datePublished=d.jpDate||d.date;
  if(d.overview&&d.overviewLang==="ja")o.description=d.overview;
  if(d.poster)o.image="https://image.tmdb.org/t/p/w500"+d.poster;
  if(d.runtime)o.duration="PT"+d.runtime+"M";
  if(d.genres.length)o.genre=d.genres;
  if(d.directors.length)o.director=d.directors.map(n=>({"@type":"Person",name:n}));
  if(d.cast.length)o.actor=d.cast.map(n=>({"@type":"Person",name:n}));
  if(d.countries.length)o.countryOfOrigin=d.countries.map(c=>({"@type":"Country",name:c}));
  el.textContent=JSON.stringify(o);
}
function nowHTML(q,isExample,movie){
  return `<header class="now"><figure class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>${movie?.poster?`<img src="${IMG}${esc(movie.poster)}" alt="${esc(q)} のポスター" width="64" height="96" decoding="async" onload="this.classList.add('ok')">`:""}</figure><div><p class="k">検索中の作品</p><h1 id="mt">${wrapWords(q)}</h1><p class="ex meta" id="imeta">${movie?.date?movie.date.slice(0,4)+"年":""}</p>${isExample==="trend"?'<p class="ex">いま話題の作品（日本で上映中・公開予定の人気上位10本）からランダムに表示しています。 <button type="button" class="clear" id="shuffle" style="padding:0;text-decoration:underline">ほかの話題作</button></p>':isExample?'<p class="ex">例として表示しています。上の欄に観たい作品名を入れてください。</p>':""}</div><button type="button" class="share" id="share" aria-label="この作品のページのリンクを共有" title="リンクを共有"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button></header>`;
}
/* ===== 作品ごとの URL（?q=作品名&id=TMDBの番号）とページタイトル =====
   サーバーの処理なしで動くよう、クエリ文字列で作品を表す。ブックマーク・共有・戻るボタンに対応。
   navMode："push"＝利用者が選んだ（履歴を1つ進める）、"replace"＝URL を置き換える、"none"＝URL はそのまま */
let navMode="none";
const slim=m=>m?{id:m.id,title:m.title,original:m.original,date:m.date,poster:m.poster}:null;
function urlFor(q,movie){
  const u=new URL(location.href);u.search="";u.hash="";
  u.searchParams.set("q",q);if(movie?.id)u.searchParams.set("id",movie.id);
  return u.toString();
}
const DESC=document.querySelector('meta[name="description"]').content;
function setMeta(q,isExample){
  const desc=q&&!isExample?`「${q}」の評判を、Filmarks・映画.com・Yahoo! など各サイトの検索結果からまとめて確認できます。チケット、SNS、配信サービスへもすぐ移動できます。`:DESC;
  document.querySelector('meta[name="description"]').content=desc;
  document.querySelector('meta[property="og:description"]').content=desc;
  document.querySelector('meta[property="og:title"]').content=document.title;
  // 作品ページは自分自身を正規URLに、おすすめ表示のトップはトップを正規URLにする
  // 正規URLは常に本番の独自ドメインにする（cinemaladder.pages.dev など別の住所で開かれても、検索エンジンには本番を伝える）
  const canon=new URL(SITE);if(q&&!isExample)canon.searchParams.set("q",q);
  document.querySelector('link[rel="canonical"]').href=canon.href;
  document.querySelector('meta[property="og:url"]').content=canon.href;
}
function syncNav(q,isExample,movie){
  document.title=q?`${q} - Cinemaladder`:"Cinemaladder";
  setMeta(q,isExample);
  const st={q,isExample,movie:slim(movie)};
  try{
    if(isExample||navMode==="none")history.replaceState(st,"",location.href);   // おすすめ表示などは URL を変えない
    else if(navMode==="push"&&new URL(location.href).searchParams.get("q")!==q)history.pushState(st,"",urlFor(q,movie));
    else history.replaceState(st,"",urlFor(q,movie));
  }catch(e){}
  navMode="push";
}
function shareUrl(){return cur?.[0]&&!cur[1]?location.href:cur?.[0]?urlFor(cur[0],cur[2]):location.href}
let toastTimer=null;
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.append(t)}
  t.textContent=msg;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),1800)}
async function share(){
  const url=shareUrl(),title=document.title;
  if(navigator.share){try{await navigator.share({title,url});return}catch(e){if(e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);toast("リンクをコピーしました")}catch(e){prompt?.("このリンクをコピーしてください",url)}
}
/* あとから TMDB の情報が分かったとき、画面全体は描き直さず、見出しとリンクだけ差し替える
   （切り替えアニメーションを途中で止めないため） */
function fillMovie(m){
  fetchInfoFor(cur[0],m);
  const [q,isExample]=cur;cur[2]=m;
  if(hist.includes(q))saveMeta(q,m);
  const now=$("#out .now");
  if(now){const t=document.createElement("div");t.innerHTML=nowHTML(q,isExample,m);now.replaceWith(t.firstElementChild)}
  const links=[...document.querySelectorAll("#out a.go")],all=GROUPS.flatMap(g=>g.items);
  links.forEach((a,i)=>{if(all[i])a.href=all[i].u(q,m)});
  try{const p=new URL(location.href).searchParams;if(p.get("q")===q&&!p.get("id")&&m.id)history.replaceState({q,isExample,movie:slim(m)},"",urlFor(q,m))
    else history.replaceState({...(history.state||{}),movie:slim(m)},"")}catch(e){}
}
/* X の除外語の編集パネル（チップの × で削除、入力欄で追加） */
let ngOpen=false;
function ngHTML(){
  return `<details class="ng" id="ng"${ngOpen?" open":""}><summary>X で除外する言葉 <span class="cnt">${ngWords.length}語</span></summary>
  <div class="ngbody">${ngWords.length?`<ul class="chips" aria-label="除外する言葉">${ngWords.map(w=>`<li class="chip">${esc(w)}<button type="button" data-ngdel="${esc(w)}" aria-label="「${esc(w)}」を除外しない">×</button></li>`).join("")}</ul>`:'<p class="ngnone">除外する言葉はありません</p>'}
  <form class="ngadd" id="ngadd"><input id="ngin" type="text" maxlength="20" placeholder="言葉を追加（例：泣ける）" autocomplete="off" enterkeyhint="done" aria-label="除外する言葉"><button type="submit">追加</button></form>
  <button type="button" class="ngreset" id="ngreset">初期設定に戻す</button></div></details>`;
}
// 除外語を変えたら、パネルと X のリンクだけ更新する
function refreshNg(keepFocus){
  const d=$("#ng");if(!d)return;
  const t=document.createElement("div");t.innerHTML=ngHTML();d.replaceWith(t.firstElementChild);
  if(cur){const all=GROUPS.flatMap(g=>g.items);[...document.querySelectorAll("#out a.go")].forEach((a,i)=>{if(all[i]?.ic==="x")a.href=all[i].u(cur[0],cur[2])})}
  if(keepFocus)$("#ngin")?.focus();
}
/* 作品の切り替えアニメーション：見出しと各グループが少しずつずれて、下からふわっと出る */
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
function playSwap(){
  if(reduceMotion.matches||!Element.prototype.animate)return;
  const els=[...document.querySelectorAll("#out .movie > *")];
  els.forEach((el,i)=>el.animate(
    [{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
    {duration:280,delay:Math.min(i,5)*45,easing:"cubic-bezier(.2,.7,.3,1)",fill:"backwards"}));
  const h1=document.querySelector("#out h1");
  if(h1)h1.animate([{color:"var(--accent)"},{color:"var(--fg)"}],{duration:900,easing:"ease-out"});
}
/* 作品名から TMDB の情報（原題・ポスター・公開年）を探す。履歴から開いたときなどに使う */
function findMovie(q){
  if(meta[q])return meta[q];
  for(const m of trendList||[])if(m.title===q)return m;
  for(const list of cache.values())for(const m of list||[])if(m.title===q)return m;
  for(const m of titles||[])if(m.title===q)return m;
  return null;
}
function render(q,isExample,movie){
  if(!movie&&q){
    movie=findMovie(q);
    // 見つからなければ作品一覧を読み込んでもう一度探す（IMDb の原題検索とポスター表示のため）
    if(!movie)lookupMovie(q).then(m=>{if(!cur||cur[0]!==q||cur[2])return;if(m)fillMovie(m);else setInfo("none")});
  }
  if(movie&&hist.includes(q))saveMeta(q,movie);
  const changed=!cur||cur[0]!==q;   // 作品が変わったときだけ切り替えのアニメーションを付ける
  cur=[q,isExample,movie];
  syncNav(q,isExample,movie);
  setLD(null);
  let h=trendHTML()+`<article class="movie" aria-labelledby="mt">`+nowHTML(q,isExample,movie)+infoHTML("loading");
  GROUPS.forEach((gr,i)=>{
    const hd=`<h2 id="g${i}">${gr.h}</h2>`;
    h+=`<section class="grp" aria-labelledby="g${i}">${gr.note?`<hgroup>${hd}<p>${gr.note}</p></hgroup>`:hd}<ul class="grid">${gr.items.map(it=>
      `<li><a class="go" href="${esc(it.u(q,movie))}" target="_blank" rel="${it.pr?.()?"noopener sponsored":"noopener"}" data-q="${esc(q)}"><span class="n"><span class="fav fav-${it.ic}" aria-hidden="true"></span><span class="nm">${it.n}</span></span><span class="d">${it.pr?.()?'<span class="pr">PR</span>':""}${it.d}</span></a></li>`).join("")}</ul>${gr.items.some(it=>it.ic==="x")?ngHTML():""}</section>`;
    if(i===1)h+='<aside class="ad" aria-label="広告"><span class="adl">広告</span>ここにバナー広告（例：320×100）</aside>';
  });
  $("#out").innerHTML=h+`</article>`;
  if(changed)playSwap();
  if(movie?.id)fetchInfoFor(q,movie);
  bindTop();
}
function bindTop(){const d=$("#top");if(d)d.addEventListener("toggle",()=>{trendOpen=d.open;store.set("cl_trendOpen",trendOpen)})}
function updateTop(){
  const d=$("#top");if(!d)return;
  const t=document.createElement("div");t.innerHTML=trendHTML();
  const n=t.firstElementChild,w=d.closest(".topwrap");
  if(n&&w){n.querySelector("details").open=d.open;w.replaceWith(n);bindTop()}
}

/* ===== イベント ===== */
$("#q").addEventListener("input",onType);
$("#q").addEventListener("keydown",e=>{
  if($("#sug").hidden||!items.length)return;
  if(e.key==="ArrowDown"){e.preventDefault();active=(active+1)%items.length;drawSug()}
  else if(e.key==="ArrowUp"){e.preventDefault();active=(active-1+items.length)%items.length;drawSug()}
  else if(e.key==="Enter"&&active>=0){e.preventDefault();pick(items[active])}
  else if(e.key==="Escape"){hideSug()}
});
$("#sug").addEventListener("mousedown",e=>{const li=e.target.closest("li[data-i]");if(li){e.preventDefault();pick(items[+li.dataset.i])}});
$("#q").addEventListener("blur",()=>setTimeout(hideSug,120));
$("#f").addEventListener("submit",e=>{e.preventDefault();const q=clean($("#q").value);if(!q)return;hideSug();remember(q);render(q);collapseTop();$("#q").blur()});
$("#clr").onclick=()=>{$("#q").value="";hideSug();$("#q").focus()};   // 入力欄だけ空にして、画面はそのまま
$("#hist").addEventListener("click",e=>{
  const x=e.target.closest("[data-del]");
  if(x){hist=hist.filter(h=>h!==x.dataset.del);saveHist();return}
  const all=e.target.closest("#delall");
  if(all){   // 誤タップ防止：1回目で確認表示、3秒以内にもう1回押すと削除
    if(all.classList.contains("warn")){clearTimeout(delTimer);hist=[];saveHist();toast("履歴を削除しました");return}
    // ボタン自体は短い表示にし、説明は画面下のお知らせで出す（狭い画面でも見切れないように）
    const icon=all.innerHTML;all.classList.add("warn");all.insertAdjacentHTML("beforeend","全削除");toast("もう一度押すと履歴を全部消します");
    delTimer=setTimeout(()=>{all.classList.remove("warn");all.innerHTML=icon},3000);return;
  }
  const b=e.target.closest("[data-q]");if(!b)return;$("#q").value=b.dataset.q;remember(b.dataset.q);render(b.dataset.q);collapseTop()});
$("#q").addEventListener("focus",()=>$("#q").select());
$("#out").addEventListener("click",e=>{if(e.target.closest("#share"))share()});
// 戻る・進む：保存しておいた状態から描き直す（URL は変えない）
addEventListener("popstate",e=>{
  const st=e.state;hideSug();
  if(st?.q){navMode="none";$("#q").value=st.q;render(st.q,st.isExample,st.movie);collapseTop()}
  else{const q=new URL(location.href).searchParams.get("q");if(q){navMode="none";$("#q").value=q;render(q)}else showTrending()}
});
$("#out").addEventListener("toggle",e=>{if(e.target.id==="ng")ngOpen=e.target.open;if(e.target.id==="info"){infoOpen=e.target.open;store.set("cl_infoOpen",infoOpen)}},true);
$("#out").addEventListener("submit",e=>{
  if(e.target.id!=="ngadd")return;e.preventDefault();
  const words=$("#ngin").value.split(/[,、，]/).map(w=>w.normalize("NFKC").trim()).filter(Boolean);
  for(const w of words)if(!ngWords.includes(w)&&ngWords.length<40)ngWords.push(w);
  saveNg();refreshNg(true);
});
$("#out").addEventListener("click",e=>{
  const del=e.target.closest("[data-ngdel]");
  if(del){ngWords=ngWords.filter(w=>w!==del.dataset.ngdel);saveNg();refreshNg();return}
  if(e.target.id==="ngreset"){ngWords=DEFAULT_NG.slice();saveNg();refreshNg()}
});   // タップで全選択し、すぐ打ち替えられるように
$("#out").addEventListener("click",e=>{if(e.target.id==="shuffle"){showTrending();return}
  const t=e.target.closest("[data-tid]");if(t){const m=trendList.find(x=>x.id===+t.dataset.tid);if(m){$("#q").value=m.title;remember(m.title);render(m.title,false,m);collapseTop();window.scrollTo({top:0,behavior:"smooth"})}return}const a=e.target.closest("a.go");if(a)remember(a.dataset.q)});

/* ===== ヘッダーの縮小 =====
   下にスクロールし始めたら縮め、上端に戻ったら広げる。境目でちらつかないよう、縮める位置と広げる位置を少しずらす */
const hdr=document.querySelector("body > header");
const folds=hdr.querySelectorAll(".fold");
function measureHeader(){
  if(document.documentElement.classList.contains("compact"))return;
  const st=document.documentElement.style,h=hdr.offsetHeight,b=folds[0].offsetHeight,t=folds[1].offsetHeight;
  st.setProperty("--hh",h+"px");          // 広げたときの高さ（本文の開始位置）
  st.setProperty("--brandh",b+"px");      // 隠すサイト名の行の高さ（その分だけ上へずらす）
  st.setProperty("--hc",(h-b-t)+"px");    // 縮めたときの背景の高さ
}
new ResizeObserver(measureHeader).observe(hdr);
let ticking=false;
addEventListener("scroll",()=>{
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    const y=scrollY,c=document.documentElement.classList.contains("compact");
    // 広がったままスクロールすると本文がヘッダーの下に潜るので、動き始めてすぐ縮め、上端に戻ったら広げる
    if(!c&&y>8){hideSug();document.documentElement.classList.add("compact")}
    else if(c&&y<2){document.documentElement.classList.remove("compact")}
  });
},{passive:true});
$("#affnote").hidden=!(AFF.amazonTag||AFF.unext||AFF.mvtk);$("#amznote").hidden=!AFF.amazonTag;
renderHist();
const startQ=(()=>{try{return clean(new URL(location.href).searchParams.get("q")||"")}catch(e){return ""}})();
if(startQ){   // 共有・ブックマークされた URL から開いたとき
  const id=+new URL(location.href).searchParams.get("id")||0;
  $("#q").value=startQ;remember(startQ);navMode="replace";
  render(startQ,false,id&&meta[startQ]?.id===id?meta[startQ]:null);
  getTrending().catch(()=>{trendFailed=true}).finally(updateTop)}
else if(hist[0]){$("#q").value=hist[0];navMode="none";render(hist[0]);
  getTrending().catch(()=>{trendFailed=true}).finally(updateTop)}   // TOP10リストだけ後から差し替える（画面全体は描き直さない）
else{$("#out").innerHTML='<p class="emptyst">いま話題の映画を読み込み中…</p>';showTrending()}
</script>
</body>
