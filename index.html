<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chinemaladder</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="dns-prefetch" href="https://cinema-ladder-api.twilightwind.workers.dev">
<meta name="description" content="作品名を1回入れるだけで、映画のレビューサイト・チケット・SNS・配信をまとめて見られます。">
<style>
:root{
  --bg:#F4F4F7;--surface:#FFFFFF;--fg:#17171C;--muted:#5E5E6B;--line:#E1E1E8;
  --accent:#B4233C;--accent-soft:#F8E4E8;--ad:#EEF0F5;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111115;--surface:#1A1A20;--fg:#ECECF1;--muted:#A0A0AC;--line:#2C2C35;--accent:#E8607A;--accent-soft:#3A1D25;--ad:#202029;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.hd{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.logo{font-weight:800;font-size:19px;letter-spacing:.01em;flex-wrap:wrap;display:flex;align-items:baseline;gap:8px}
.logo b{color:var(--accent)}
.logo small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.sbox{position:relative}
form.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px}
form.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;outline:none;font-size:16px}
.search svg{flex:none;width:17px;height:17px;stroke:var(--muted)}
.clear{border:0;background:transparent;color:var(--muted);padding:6px 8px;font-size:13px}

/* サジェスト */
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;max-height:60vh;overflow-y:auto;z-index:6;margin:0;padding:4px;list-style:none}
.sug li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.sug li[aria-selected="true"],.sug li:hover{background:var(--accent-soft)}
.sug img,.sug .noimg{width:36px;height:54px;border-radius:4px;object-fit:cover;background:var(--bg)}
.sug .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .o{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .msg{display:block;padding:10px;color:var(--muted);font-size:13px;cursor:default}
.sug .msg:hover{background:none}

.hist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hist .lbl{font-size:12px;color:var(--muted);flex:none;align-self:center}
.hist .hc{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px}
.hist .hc button{border:0;background:transparent;border-radius:999px}
.hist .hc [data-q]{padding:3px 2px 3px 11px}
.hist .x{padding:3px 10px 3px 6px;color:var(--muted);line-height:1}
.hist .x:hover{color:var(--accent)}
.hist .delall{flex:none;border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:3px 6px;white-space:nowrap}
.hist .delall.warn{color:var(--accent);font-weight:700;text-decoration:none}

main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;
  display:flex;flex-direction:column;gap:18px}
.now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
/* ポスター枠は画像の有無にかかわらず常に 64×96 を確保し、読み込み後にずれないようにする */
.now .ph{position:relative;width:64px;height:96px;flex:none;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--line)}
.now .ph svg{width:24px;height:24px}
.now .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.now .ph img.ok{opacity:1}
.now .yr{display:block;min-height:1.6em}   /* 公開年の行も先に高さを確保する */
.now .k{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.now h1{margin:0;font-size:24px;line-height:1.3;text-wrap:balance;word-break:break-word}
.now .ex{font-size:12px;color:var(--muted)}

.grp{display:flex;flex-direction:column;gap:8px}
.grp h2{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.grp h2 small{font-weight:500;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
a.go{display:flex;flex-direction:column;gap:1px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px;justify-content:center;transition:border-color .12s,transform .12s}
a.go:hover{border-color:var(--accent)}
a.go:active{transform:scale(.98)}
a.go .n{font-weight:700;display:flex;align-items:center;gap:6px}
a.go .fav{width:16px;height:16px;border-radius:3px;flex:none;background-position:center;background-size:16px 16px;background-repeat:no-repeat}

<body>
<header>
  <div class="hd">
    <div class="logo"><span>Chinema<b>ladder</b></span><small>映画の評判を、はしごする</small></div>
    <div class="sbox">
      <form class="search" id="f" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="作品名を入力" autocomplete="off" aria-label="作品名"
          role="combobox" aria-expanded="false" aria-controls="sug" aria-autocomplete="list">
        <button class="clear" type="button" id="clr">消す</button>
      </form>
      <ul class="sug" id="sug" role="listbox" hidden></ul>
    </div>
    <div class="hist" id="hist"></div>
  </div>
</header>

<main id="out"></main>

<footer>
  <div>作品情報とポスター画像は TMDB から取得しています。This product uses the TMDB API but is not endorsed or certified by TMDB.</div>
</footer>

<script>
/* ===== 設定 =====
   TMDB のトークンはブラウザに置かない。サジェストは Cloudflare Workers の中継、
   話題作TOP10と予備の作品一覧は GitHub Actions が毎日作る data/*.json を使う。 */
const TMDB_PROXY = "https://cinema-ladder-api.twilightwind.workers.dev/search";   // Cloudflare Workers の中継（worker/worker.js）
const IMG = "https://image.tmdb.org/t/p/w92";

const E=encodeURIComponent;
const GROUPS=[
 {h:"レビュー",note:"星とレビューを見る",items:[
  {n:"Filmarks",ic:"filmarks",d:"レビュー数が多い",main:1,u:q=>"https://filmarks.com/search/movies?q="+E(q)},
  {n:"映画.com",ic:"eiga",d:"評価・作品情報",u:q=>"https://eiga.com/search/"+E(q)+"/"},
  {n:"Movie Walker",ic:"moviewalker",d:"評価・ニュース",u:q=>"https://press.moviewalker.jp/search/free_search.cgi?keyword="+E(q)},
  {n:"映画ランド",ic:"eigaland",d:"評価・上映情報",u:q=>"https://eigaland.com/movie?sort=openDate&q="+E(q)},
  {n:"KINENOTE",ic:"kinenote",d:"キネマ旬報の評価",u:q=>"https://www.kinenote.com/sp/public/cinema/search_result.aspx?key="+E(q)},
  // IMDb は日本語タイトルだと見つからないことが多いので、TMDB の原題が分かればそちらで検索する。s=tt&ttype=ft は「映画作品だけ」に絞る指定
  {n:"IMDb",ic:"imdb",d:"海外の評価",u:(q,m)=>"https://www.imdb.com/find/?q="+E(m?.original||q)+"&s=tt&ttype=ft"},
  // p=検索語、ei=文字コード。ほかのパラメータ（ai, ts, aq, fr など）は Yahoo の計測用なので不要
  {n:"Yahoo!検索",ic:"yahoo",d:"評価・口コミ・記事",u:q=>"https://search.yahoo.co.jp/search?p="+E(withEiga(q))+"&ei=UTF-8"},
 ]},
 {h:"チケット・上映館",note:"",items:[
  {n:"ムビチケ",ic:"mvtk",d:"前売券を買う",pr:1,u:q=>"https://store.moviewalker.jp/search?keyword=name:"+E(q)},
  {n:"上映館を探す",ic:"eiga",d:"映画.comの上映中検索",u:q=>"https://eiga.com/now/q/?title="+E(q)+"&region=&pref=&area=&genre=on&sort=release"},
 ]},
 {h:"SNSの声",note:"ネタバレ語を除外して検索",items:[
  {n:"X",ic:"x",d:"ネタバレになりやすい語を除外",u:q=>"https://x.com/search?f=live&q="+E(`"${q}" `+SPOILER_WORDS.map(w=>"-"+w).join(" "))},
  {n:"Instagram",ic:"instagram",d:"ハッシュタグ",u:q=>"https://www.instagram.com/explore/tags/"+E(q.replace(/[\s・:：!！?？、。「」『』\-]/g,""))+"/"},
 ]},
 {h:"配信",note:"",items:[
  {n:"U-NEXT",ic:"unext",d:"見放題・レンタル",pr:1,u:q=>"https://video.unext.jp/freeword?query="+E(q)},
  {n:"Prime Video",ic:"primevideo",d:"見放題・レンタル",pr:1,u:q=>"https://www.amazon.co.jp/s?i=instant-video&k="+E(q)},
  {n:"Netflix",ic:"netflix",d:"見放題",u:q=>"https://www.netflix.com/search?q="+E(q)},
 ]},
];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=s=>s.normalize("NFKC").replace(/\s+/g," ").trim();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hist=store.get("mirumae_hist",[]);
/* 履歴の作品ごとの TMDB 情報（ポスター・原題・公開年）。履歴から開いたときに使う */
let meta=store.get("mirumae_meta",{});
function saveMeta(q,m){
  if(!m||!q)return;
  meta[q]={id:m.id,title:m.title,original:m.original,date:m.date,poster:m.poster};
  for(const k of Object.keys(meta))if(!hist.includes(k)&&k!==q)delete meta[k];   // 履歴から消えた分は捨てる
  store.set("mirumae_meta",meta);
}
try{localStorage.removeItem("mirumae_tmdb")}catch(e){}   // 以前の開発用トークンが残っていれば消す
// Yahoo!検索用：同名の本や曲を避けるため「映画」を付ける（タイトルに入っていれば付けない）
const withEiga=q=>q.includes("映画")?q:q+" 映画";
/* X検索で除外する語。増やすほど安全ですが、普通の感想も減ります。 */
const SPOILER_WORDS=["ネタバレ","結末","犯人","ラスト","オチ","真相","正体","黒幕","伏線回収","考察","どんでん返し","死亡","生存"];

/* ===== TMDB サジェスト ===== */
const cache=new Map();
let ctrl=null,timer=null,items=[],active=-1;

/* 作品名一覧（data/titles.json）から候補を出す。トークン不要で誰でも使える。
   GitHub Actions が毎日、人気作・評価の多い作品・上映中・公開予定の数千本を書き出している。 */
let titles=null,titlesLoading=null;
// 表記ゆれ対策：全角半角・カタカナひらがな・記号や空白の違いを無視して比べる
const norm=s=>(s||"").normalize("NFKC").toLowerCase()
  .replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
  .replace(/[\s・･:：\-‐－ー〜~!！?？、。,.「」『』（）()\/／&＆'"]/g,"");
function loadTitles(){
  if(titles)return Promise.resolve(titles);
  return titlesLoading??=fetch("data/titles.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
    titles=j.items.map(([id,title,year,poster,original])=>({id,title,date:year,poster,original:original||title,k:norm(title),ko:original?norm(original):""}));
    return titles;
  }).catch(e=>{titlesLoading=null;throw e});
}
async function searchLocal(q){
  const list=await loadTitles(),k=norm(q);
  if(!k)return [];
  const head=[],mid=[];   // 前方一致を先に、部分一致を後に（どちらも人気順）
  for(const m of list){
    if(m.k.startsWith(k)||m.ko.startsWith(k))head.push(m);
    else if(m.k.includes(k)||m.ko.includes(k))mid.push(m);
    if(head.length>=8)break;
  }
  return head.concat(mid).slice(0,8);
}

async function searchTMDB(q){
  if(cache.has(q))return cache.get(q);
  ctrl?.abort();ctrl=new AbortController();
  let res;
  try{
    const r=await fetch(TMDB_PROXY+"?q="+E(q),{signal:ctrl.signal});
    if(!r.ok)throw new Error(r.status);
    res=await r.json();
    if(!Array.isArray(res))throw new Error("bad");
  }catch(e){
    if(e.name==="AbortError")throw e;
    res=await searchLocal(q);   // 中継が使えないときは作品一覧から候補を出す
  }
  cache.set(q,res);return res;
}
/* ===== 話題作TOP10（日本で上映中＋公開予定を人気順に） ===== */
let trendList=null;
async function getTrending(){
  if(trendList)return trendList;
  // 1. GitHub Actions が毎日作る data/trending.json（トークン不要・誰でも見られる）
  try{
    const r=await fetch("data/trending.json",{cache:"no-cache"});
    if(r.ok){const j=await r.json();if(j.items?.length){trendList=j.items;return trendList}}
  }catch(e){}
  // 2. ファイルが読めないときは中継サーバーから
  const r=await fetch(TMDB_PROXY.replace(/search$/,"trending"));
  if(!r.ok)throw new Error(r.status);
  trendList=await r.json();
  return trendList;
}
let lastPick=null;
async function showTrending(){
  const before=$("#q").value;
  try{
    const list=await getTrending();
    if($("#q").value!==before)return;   // 読み込み中に入力されたら上書きしない
    if(list.length){
      const pool=list.length>1?list.filter(m=>m.id!==lastPick):list;   // 同じ作品が連続しないように
      const m=pool[Math.floor(Math.random()*pool.length)];lastPick=m.id;
      $("#q").value=m.title;   // 検索ボックスにも同じ作品名を入れる
      render(m.title,"trend",m);return;
    }
  }catch(e){}
  if($("#q").value===before){$("#q").value="";renderEmpty()}
}
let trendOpen=store.get("mirumae_trendOpen",false);
const isUpcoming=d=>d&&d>new Date().toISOString().slice(0,10);
/* TOP10を閉じるアニメーション：高さを0に縮めながら薄くし、終わったら details を閉じる */
function collapseTop(){
  const d=$("#top"),ol=d?.querySelector("ol");
  if(!d||!d.open)return;
  if(!ol||!ol.animate||matchMedia("(prefers-reduced-motion: reduce)").matches){d.open=false;return}
  ol.style.overflow="hidden";
  const a=ol.animate([{height:ol.offsetHeight+"px",opacity:1,marginTop:"8px"},{height:"0px",opacity:0,marginTop:"0px"}],
    {duration:320,delay:120,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});   // 選んだ行の色が一瞬見えてから閉じる
  a.onfinish=()=>{d.open=false;a.cancel();ol.style.overflow=""};
}
function trendHTML(){
  if(!trendList?.length)return "";
  return `<details class="top" id="top"${trendOpen?" open":""}><summary>いま話題の映画 TOP${trendList.length}</summary><ol>${trendList.map((m,i)=>
    `<li><button type="button" data-tid="${m.id}"${cur&&cur[0]===m.title?' class="on" aria-current="true"':""}><span class="rk">${i+1}</span>${m.poster?`<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy" width="32" height="48">`:'<span class="noimg"></span>'}<span style="min-width:0"><b>${esc(m.title)}</b><small>${isUpcoming(m.date)?`公開予定 ${+m.date.slice(5,7)}月${+m.date.slice(8,10)}日`:"上映中"}</small></span></button></li>`).join("")}</ol></details>`;
}

function showSug(html){const s=$("#sug");s.innerHTML=html;s.hidden=!html;$("#q").setAttribute("aria-expanded",String(!!html))}
function hideSug(){showSug("");items=[];active=-1}
function drawSug(){
  showSug(items.map((m,i)=>`<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i===active}">
    ${m.poster?`<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy" width="36" height="54">`:'<span class="noimg"></span>'}
    <span style="min-width:0"><div class="t">${esc(m.title)}</div><div class="o">${m.date?m.date.slice(0,4)+"年":"公開年不明"}${m.original&&m.original!==m.title?"・"+esc(m.original):""}</div></span></li>`).join(""));
  $("#q").setAttribute("aria-activedescendant",active>=0?"opt"+active:"");
}
function onType(){
  const q=clean($("#q").value);
  clearTimeout(timer);
  if(q.length<1){hideSug();return}
  timer=setTimeout(async()=>{
    try{
      const r=await searchTMDB(q);
      if(clean($("#q").value)!==q)return;
      items=r;active=-1;
      r.length?drawSug():showSug('<li class="msg">候補にありません。Enter でそのまま検索できます。</li>');
    }catch(e){
      if(e.name==="AbortError")return;
      items=[];
      showSug('<li class="msg">候補を取得できませんでした。そのまま検索はできます。</li>');
    }
  },250);
}
function pick(m){$("#q").value=m.title;hideSug();remember(m.title);saveMeta(m.title,m);render(m.title,false,m);collapseTop();$("#q").blur()}

/* ===== 画面 ===== */
function remember(q){hist=[q,...hist.filter(x=>x!==q)].slice(0,8);store.set("mirumae_hist",hist);renderHist()}
function renderHist(){$("#hist").innerHTML=hist.length?'<span class="lbl">最近</span>'+hist.map(h=>`<span class="hc"><button type="button" data-q="${esc(h)}">${esc(h)}</button><button type="button" class="x" data-del="${esc(h)}" aria-label="「${esc(h)}」を履歴から削除">×</button></span>`).join("")+'<button type="button" class="delall" id="delall">履歴をすべて削除</button>':""}
function saveHist(){store.set("mirumae_hist",hist);renderHist()}
let delTimer=null;
let cur=null;
function renderEmpty(){cur=null;$("#out").innerHTML='<div class="emptyst"><b>観たい映画の名前を入れてください</b><span>レビュー、チケット、SNS、配信の検索結果へまとめて飛べます。</span></div>'}
/* 作品名から TMDB の情報を、手元にない場合に取りに行く。
   1. 作品一覧（data/titles.json） 2. 中継サーバーで検索し、タイトルが完全に一致したもの */
async function lookupMovie(q){
  try{await loadTitles();const m=findMovie(q);if(m)return m}catch(e){}
  try{
    const r=await fetch(TMDB_PROXY+"?q="+E(q));
    if(r.ok){const list=await r.json();if(Array.isArray(list)){cache.set(q,list);return list.find(m=>m.title===q)||null}}
  }catch(e){}
  return null;
}
function nowHTML(q,isExample,movie){
  return `<div class="now"><div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>${movie?.poster?`<img src="${IMG}${esc(movie.poster)}" alt="" width="64" height="96" decoding="async" onload="this.classList.add('ok')">`:""}</div><div><span class="k">検索中の作品</span><h1>${esc(q)}</h1><span class="ex yr">${movie?.date?`${movie.date.slice(0,4)}年${movie.original&&movie.original!==movie.title?"・"+esc(movie.original):""}`:""}</span>${isExample==="trend"?'<span class="ex">いま話題の作品（日本で上映中・公開予定の人気上位10本）からランダムに表示しています。 <button type="button" class="clear" id="shuffle" style="padding:0;text-decoration:underline">ほかの話題作</button></span>':isExample?'<span class="ex">例として表示しています。上の欄に観たい作品名を入れてください。</span>':""}</div></div>`;
}
/* あとから TMDB の情報が分かったとき、画面全体は描き直さず、見出しとリンクだけ差し替える
   （切り替えアニメーションを途中で止めないため） */
function fillMovie(m){
  const [q,isExample]=cur;cur[2]=m;
  if(hist.includes(q))saveMeta(q,m);
  const now=$("#out > .now");
  if(now){const t=document.createElement("div");t.innerHTML=nowHTML(q,isExample,m);now.replaceWith(t.firstElementChild)}
  const links=[...document.querySelectorAll("#out a.go")],all=GROUPS.flatMap(g=>g.items);
  links.forEach((a,i)=>{if(all[i])a.href=all[i].u(q,m)});
}
/* 作品の切り替えアニメーション：見出しと各グループが少しずつずれて、下からふわっと出る */
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
function playSwap(){
  if(reduceMotion.matches||!Element.prototype.animate)return;
  const els=[...document.querySelectorAll("#out > .now, #out > .grp, #out > .ad")];
  els.forEach((el,i)=>el.animate(
    [{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
    {duration:280,delay:Math.min(i,5)*45,easing:"cubic-bezier(.2,.7,.3,1)",fill:"backwards"}));
  const h1=document.querySelector("#out h1");
  if(h1)h1.animate([{color:"var(--accent)"},{color:"var(--fg)"}],{duration:900,easing:"ease-out"});
}
/* 作品名から TMDB の情報（原題・ポスター・公開年）を探す。履歴から開いたときなどに使う */
function findMovie(q){
  if(meta[q])return meta[q];
  for(const m of trendList||[])if(m.title===q)return m;
  for(const list of cache.values())for(const m of list||[])if(m.title===q)return m;
  for(const m of titles||[])if(m.title===q)return m;
  return null;
}
function render(q,isExample,movie){
  if(!movie&&q){
    movie=findMovie(q);
    // 見つからなければ作品一覧を読み込んでもう一度探す（IMDb の原題検索とポスター表示のため）
    if(!movie)lookupMovie(q).then(m=>{if(m&&cur&&cur[0]===q&&!cur[2])fillMovie(m)});
  }
  if(movie&&hist.includes(q))saveMeta(q,movie);
  const changed=!cur||cur[0]!==q;   // 作品が変わったときだけ切り替えのアニメーションを付ける
  cur=[q,isExample,movie];
  let h=trendHTML()+nowHTML(q,isExample,movie);
  GROUPS.forEach((gr,i)=>{
    h+=`<section class="grp"><h2>${gr.h}${gr.note?`<small>${gr.note}</small>`:""}</h2><div class="grid">${gr.items.map(it=>
      `<a class="go${it.main?" main":""}" href="${esc(it.u(q,movie))}" target="_blank" rel="noopener" data-q="${esc(q)}"><span class="n"><span class="fav fav-${it.ic}" aria-hidden="true"></span>${it.n}${it.pr?'<span class="pr">PR</span>':""}</span><span class="d">${it.d}</span></a>`).join("")}</div></section>`;
    if(i===1)h+='<div class="ad"><b>広告</b>ここにバナー広告（例：320×100）</div>';
  });
  $("#out").innerHTML=h;
  if(changed)playSwap();
  const d=$("#top");if(d)d.addEventListener("toggle",()=>{trendOpen=d.open;store.set("mirumae_trendOpen",trendOpen)});
}

/* ===== イベント ===== */
$("#q").addEventListener("input",onType);
$("#q").addEventListener("keydown",e=>{
  if($("#sug").hidden||!items.length)return;
  if(e.key==="ArrowDown"){e.preventDefault();active=(active+1)%items.length;drawSug()}
  else if(e.key==="ArrowUp"){e.preventDefault();active=(active-1+items.length)%items.length;drawSug()}
  else if(e.key==="Enter"&&active>=0){e.preventDefault();pick(items[active])}
  else if(e.key==="Escape"){hideSug()}
});
$("#sug").addEventListener("mousedown",e=>{const li=e.target.closest("li[data-i]");if(li){e.preventDefault();pick(items[+li.dataset.i])}});
$("#q").addEventListener("blur",()=>setTimeout(hideSug,120));
$("#f").addEventListener("submit",e=>{e.preventDefault();const q=clean($("#q").value);if(!q)return;hideSug();remember(q);render(q);collapseTop();$("#q").blur()});
$("#clr").onclick=()=>{$("#q").value="";hideSug();$("#q").focus()};   // 入力欄だけ空にして、画面はそのまま
$("#hist").addEventListener("click",e=>{
  const x=e.target.closest("[data-del]");
  if(x){hist=hist.filter(h=>h!==x.dataset.del);saveHist();return}
  const all=e.target.closest("#delall");
  if(all){   // 誤タップ防止：1回目で確認表示、3秒以内にもう1回押すと削除
    if(all.classList.contains("warn")){clearTimeout(delTimer);hist=[];saveHist();return}
    all.classList.add("warn");all.textContent="もう一度押すと全部消えます";
    delTimer=setTimeout(()=>{all.classList.remove("warn");all.textContent="履歴をすべて削除"},3000);return;
  }
  const b=e.target.closest("[data-q]");if(!b)return;$("#q").value=b.dataset.q;remember(b.dataset.q);render(b.dataset.q);collapseTop()});
$("#q").addEventListener("focus",()=>$("#q").select());   // タップで全選択し、すぐ打ち替えられるように
$("#out").addEventListener("click",e=>{if(e.target.id==="shuffle"){showTrending();return}
  const t=e.target.closest("[data-tid]");if(t){const m=trendList.find(x=>x.id===+t.dataset.tid);if(m){$("#q").value=m.title;remember(m.title);render(m.title,false,m);collapseTop();window.scrollTo({top:0,behavior:"smooth"})}return}const a=e.target.closest("a.go");if(a)remember(a.dataset.q)});

renderHist();
if(hist[0]){$("#q").value=hist[0];render(hist[0]);
  getTrending().then(()=>cur&&render(...cur)).catch(()=>{})}   // TOP10リストだけ後から読み込む
else{$("#out").innerHTML='<div class="emptyst"><span>いま話題の映画を読み込み中…</span></div>';showTrending()}
</script>
</body>
