name: 話題作TOP10とサジェスト用の作品一覧を更新

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  workflow_dispatch:         # Actions 画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1           # 同じリポジトリへの push がぶつからないよう順番に
      matrix:
        branch: [staging, main] # 確認用と本番の両方のデータを更新する
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: サイト本体がないブランチは飛ばす
        id: chk
        run: test -f index.html && echo ok=1 >> "$GITHUB_OUTPUT" || echo "index.html がないので更新しません"
      - name: 話題作TOP10を取得
        if: steps.chk.outputs.ok
        run: node scripts/fetch-trending.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: サジェスト用の作品一覧を取得
        if: steps.chk.outputs.ok
        run: node scripts/fetch-titles.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: 足りないファビコンを取得し、index.html に埋め込む
        if: steps.chk.outputs.ok
        run: |
          node scripts/fetch-icons.mjs
          pip install --quiet --break-system-packages "pillow>=11"
          python3 scripts/inline-icons.py
      - name: 変わっていればコミット
        if: steps.chk.outputs.ok
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/trending.json data/titles.json icons index.html
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "話題作TOP10と作品一覧を更新"
          git pull --rebase -q origin ${{ matrix.branch }}
          git push
