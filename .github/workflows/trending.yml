name: 話題作TOP10を更新

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  workflow_dispatch:         # Actions 画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TMDB から取得
        run: node scripts/fetch-trending.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: 変わっていればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/trending.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "話題作TOP10を更新"
          git push
